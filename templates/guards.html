{% extends "base.html" %}

{% block title %}隊員管理{% endblock %}

{% block content %}

<h1>👮‍♂️ 隊員管理</h1>

<div style="margin-bottom:20px;">
    <a href="/guard-form">
        <button style="width:auto;">
            ＋ 隊員登録
        </button>
    </a>
</div>

<div class="table-card">

<table>

    <tr>
        <th>ID</th>
        <th>氏名</th>
        <th>電話番号</th>
        <th>資格</th>
        <th>状態</th>
        <th>操作</th>
    </tr>

    {% for guard in guards %}
    <tr>
        <td>{{ guard.id }}</td>
        <td>{{ guard.name }}</td>
        <td>{{ guard.phone }}</td>
        <td>{{ guard.qualification }}</td>
        <td>{{ guard.status }}</td>

        <td>
            <a href="/edit/{{ guard.id }}">編集</a>
            <a href="/delete/{{ guard.id }}">削除</a>
        </td>
    </tr>
    {% endfor %}

</table>

</div>

{% endblock %}
