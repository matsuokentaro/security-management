{% extends "base.html" %}

{% block title %}現場登録{% endblock %}

{% block content %}

<h1>🏢 現場登録</h1>

<div class="form-card">

<form method="POST">

    <label>現場名</label>
    <input type="text" name="site_name" required>

    <label>住所</label>
    <input type="text" name="address" required>

    <label>担当者</label>
    <input type="text" name="manager">

    <label>備考</label>
    <input type="text" name="memo">

    <button type="submit">
        登録
    </button>

</form>

</div>

{% endblock %}
